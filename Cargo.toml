[package]
name = "commentcleanup"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fancy-regex = "0.20"
giallo = { version = "0.6", features = ["dump"] }
iced = { version = "0.14", features = ["advanced", "svg"] }
ignore = "0.4.34"
miniz_oxide = "0.9.1"
notify = "8"
png = "0.18.1"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
unicode-segmentation = "1"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "platform-verifier"] }

[dev-dependencies]
resvg = "=0.45.1"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
