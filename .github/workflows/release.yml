# Pushing a tag such as v0.2.0 builds the app and publishes it as a release.
# The tag becomes the version, and the commit is stamped into the executable.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  ASSET: CommentCleanup-windows-x64.exe

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stamp the build
        run: |
          echo "COMMENTCLEANUP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMENTCLEANUP_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "COMMENTCLEANUP_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          cp target/release/commentcleanup.exe "dist/$ASSET"
          cp target/release/commentcleanup-check.exe dist/CommentCleanup-check-windows-x64.exe
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "CommentCleanup $GITHUB_REF_NAME" \
            --notes "Built from commit $GITHUB_SHA." \
            --generate-notes
